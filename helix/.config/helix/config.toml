theme = "rose_brabli"

[editor]
line-number = "relative"
color-modes = true
middle-click-paste = false
cursorline = true
rainbow-brackets = true

[editor.lsp]
display-inlay-hints = false

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.soft-wrap]
enable = true
max-indent-retain = 999

[editor.indent-guides]
render = true
character = "┊"

[editor.whitespace.render]
newline = "none"

[editor.smart-tab]
"supersede-menu" = true

[keys.insert]
C-space = "completion"

[keys.normal.space]
"." = "file_picker_in_current_buffer_directory"
"t" = [":toggle-option lsp.display-inlay-hints"]

[keys.normal."+"]
m = [":lsp-workspace-command open-preview"] # Open markdown preview in browser using `mpls`
p = [":sh open -a Firefox %{buffer_name}"] # Open the current file in Firefox (no live reload)
b = ":echo %sh{git blame -L %{cursor_line},+1 %{buffer_name}}" # Git blame for the current line
d = ":insert-output date +%%F | tr -d '\\n'"
P = [":pipe-to echo %{file_path_absolute} | copy", ":echo Copied buffer path %{file_path_absolute}"]

[keys.normal]
"0" = "goto_line_start"
esc = "collapse_selection"
D = "kill_to_line_end" # Make this yank first?
C = ["extend_to_line_end", "change_selection"] 
C-c = "copy_selection_on_next_line"
"C-;" = "flip_selections" # Cool this doesn't work with tmux. UPDATE: Cool this works with herdr
"K" = "hover"
"C-r" = "redo"
"-" = [
  ':sh rm -f /tmp/unique-file',
  ':insert-output yazi %{buffer_name} --chooser-file=/tmp/unique-file',
  ':insert-output echo "\x1b[?1049h\x1b[?2004h" > /dev/tty',
  ':open %sh{cat /tmp/unique-file}',
  ':redraw',
]
