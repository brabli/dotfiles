onboarding = false

[theme]
name = "rose-pine"

[keys]
prefix = "ctrl+s"
rename_tab = "prefix+r"
rename_workspace = "prefix+R"
navigate_workspace_up = "k"
navigate_workspace_down = "j"
reload_config = "prefix+comma"

[ui]
prompt_new_tab_name = false

[ui.sidebar.agents]
rows = [["state_icon", "workspace", "tab"]]
row_gap = 1
